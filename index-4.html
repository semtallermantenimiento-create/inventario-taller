<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B222C">
<title>Inventario de Taller — SEM Ingenieros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3F1EA;
    --panel: #FFFFFF;
    --line: #E3DECF;
    --ink: #211F1A;
    --muted: #726C5C;
    --brand: #1B222C;
    --brand-ink: #F3F1EA;
    --accent: #C97A2E;
    --accent-soft: #F3E4CE;
    --accent-ink: #1B222C;
    --danger: #A3402F;
    --danger-soft: #F6E6E2;
    --ok: #3F7A5E;
  }
  html[data-theme="dark"] {
    --paper: #15181C;
    --panel: #1E2227;
    --line: #2B2F35;
    --ink: #EDEBE3;
    --muted: #9B9686;
    --accent-soft: #33270F;
    --danger-soft: #3D2B26;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--paper); color: var(--ink);
    transition: background .2s, color .2s;
  }
  #shell { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  header.brand {
    background: var(--brand); color: var(--brand-ink);
    padding: 14px 18px; display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 20;
  }
  header.brand .mark {
    width: 34px; height: 34px; border-radius: 9px; background: var(--accent);
    color: var(--accent-ink); display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; letter-spacing: .01em; flex-shrink: 0;
  }
  header.brand .titles { flex: 1; min-width: 0; }
  header.brand .titles .t1 { font-weight: 700; font-size: 14.5px; line-height: 1.2; }
  header.brand .titles .t2 { font-weight: 500; font-size: 12px; color: #B9BEC6; line-height: 1.3; }
  header.brand .theme-btn {
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); color: var(--brand-ink);
    border-radius: 20px; padding: 7px 12px; font-size: 12.5px; font-weight: 600; font-family: inherit;
  }

  main.content { flex: 1; padding: 18px 18px 28px; }

  nav.tabbar {
    position: sticky; bottom: 0; z-index: 20;
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--panel); border-top: 1px solid var(--line);
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  nav.tabbar button {
    background: none; border: none; font-family: inherit; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 2px; font-size: 11px; font-weight: 600; border-radius: 10px;
  }
  nav.tabbar button.active { color: var(--accent); }
  nav.tabbar button svg { width: 21px; height: 21px; }

  h1 { font-size: 19px; font-weight: 700; margin: 0 0 4px; letter-spacing: -.01em; }
  p.sub { color: var(--muted); font-size: 13.5px; margin: 0 0 16px; line-height: 1.4; }

  input {
    width: 100%; padding: 13px 14px; border-radius: 11px; border: 1px solid var(--line);
    font-size: 15px; font-family: inherit; background: var(--panel); color: var(--ink); margin-bottom: 8px;
  }
  input::placeholder { color: var(--muted); }
  input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  button { font-family: inherit; cursor: pointer; }

  .btn-primary {
    width: 100%; padding: 14px 0; border-radius: 11px; border: none;
    background: var(--accent); color: var(--accent-ink); font-size: 15px; font-weight: 700;
  }
  .btn-back {
    background: none; border: none; color: var(--muted); font-size: 13.5px; font-weight: 600;
    padding: 0 0 14px; display: flex; align-items: center; gap: 4px;
  }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 13px;
    padding: 16px; margin-bottom: 10px;
  }
  .card strong { display: block; font-size: 15px; font-weight: 700; }
  .card .d { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; }

  .action-row {
    width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 15px 16px; margin-bottom: 9px; font-size: 15px;
    font-weight: 700; color: var(--ink); display: flex; align-items: center; justify-content: space-between;
  }
  .action-row .d { display: block; color: var(--muted); font-size: 12.5px; font-weight: 500; margin-top: 2px; }

  .row-btn {
    width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line);
    border-radius: 11px; padding: 12px 14px; margin-bottom: 7px; font-size: 14px; color: var(--ink);
  }
  .row-btn strong { display: block; font-size: 14px; font-weight: 700; }
  .row-btn .d { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }

  .grupo-titulo {
    font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 16px 0 7px;
  }
  .grupo-titulo:first-child { margin-top: 0; }

  .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cat-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 10px; text-align: center; color: var(--ink);
  }
  .cat-card .icono-circulo {
    width: 54px; height: 54px; border-radius: 50%; background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 9px; color: var(--accent);
    overflow: hidden;
  }
  .cat-card .icono-circulo svg { width: 27px; height: 27px; }
  .cat-card .icono-circulo img { width: 100%; height: 100%; object-fit: cover; }
  .cat-card strong { font-size: 12.5px; font-weight: 700; display: block; line-height: 1.25; }
  .cat-card span.count { font-size: 11px; color: var(--muted); }

  .resultados-box {
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 12px; padding: 12px 12px 5px 13px; margin-bottom: 14px;
  }
  .resultados-box .titulo-caja { font-size: 12.5px; font-weight: 700; color: var(--accent); margin: 0 0 8px; }
  .resultados-box .grupo-titulo:first-child { margin-top: 0; }
  .resultados-box .row-btn { background: var(--paper); }

  .chip {
    padding: 9px 15px; border-radius: 20px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); font-size: 13.5px; font-weight: 600; display: inline-block; margin: 0 7px 7px 0;
  }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  .tipo {
    flex: 1; padding: 11px 0; border-radius: 11px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font-size: 14px; font-weight: 700;
  }
  .tipo.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  .err { color: var(--danger); font-size: 13px; margin: 4px 0 10px; font-weight: 600; }
  .ok { color: var(--ok); font-size: 13.5px; text-align: center; margin-top: 12px; font-weight: 700; }

  .badge { font-size: 11px; padding: 3px 9px; border-radius: 10px; font-weight: 700; }
  .badge.prev { background: var(--accent-soft); color: var(--accent); }
  .badge.corr { background: var(--danger-soft); color: var(--danger); }
</style>

function initTheme() {
  const saved = localStorage.getItem('taller_theme');
  const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
}
function toggleTheme() {
  const nuevo = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', nuevo);
  localStorage.setItem('taller_theme', nuevo);
  render();
}

async function api(action, method, body) {
  if (!SCRIPT_URL) return null;
  if (method === 'GET') {
    const r = await fetch(`${SCRIPT_URL}?action=${action}${body ? '&id=' + encodeURIComponent(body) : ''}`);
    return r.json();
  }
  const r = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action, ...body }) });
  return r.json();
}
async function listaEquipos() {
  if (SCRIPT_URL) { const r = await api('listEquipos', 'GET'); return r || []; }
  return EQUIPOS_DEMO;
}
function coincide(e, q) {
  q = q.toLowerCase();
  return ['Nombre','Categoria','Numero','NumeroSerie','Asignado a'].some(k => (e[k] || '').toString().toLowerCase().includes(q));
}
function agruparPorCategoria(lista) {
  const grupos = {};
  lista.forEach(e => { (grupos[e.Categoria] = grupos[e.Categoria] || []).push(e); });
  return grupos;
}
function renderListaAgrupada(lista, dataAttr) {
  const grupos = agruparPorCategoria(lista);
  if (Object.keys(grupos).length === 0) return '<p class="sub" style="margin:0;">Sin resultados.</p>';
  return Object.entries(grupos).map(([cat, items]) => `
    <p class="grupo-titulo">${cat}</p>
    ${items.map(e => `<button class="row-btn" data-${dataAttr}="${e.ID}"><strong>${e.Nombre}</strong><span class="d">${e['Asignado a'] || ''}${e.NumeroSerie ? ' — serie ' + e.NumeroSerie : ''}</span></button>`).join('')}
  `).join('');
}

function header() {
  const showTheme = state.screen === 'home';
  const actual = document.documentElement.getAttribute('data-theme');
  return `
    <header class="brand">
      <div class="mark">SI</div>
      <div class="titles">
        <div class="t1">SEM Ingenieros</div>
        <div class="t2">Inventario de taller</div>
      </div>
      ${showTheme ? `<button class="theme-btn" id="btn-tema">${actual === 'dark' ? 'Claro' : 'Oscuro'}</button>` : ''}
    </header>
  `;
}

function render() {
  const shell = document.getElementById('shell');
  if (!state.tecnico) { shell.innerHTML = screenNombre(); bind(); return; }
  const map = { home: screenHome, ficha: screenFicha, categorias: screenCategorias, catlist: screenCatList, mant: screenMant, asig: screenAsig, historial: screenHistorial, inventario: screenInventario, 'inventario-equipos': screenInventarioEquipos, 'inventario-personas': screenInventarioPersonas };
  shell.innerHTML = header() + `<main class="content">${map[state.screen]()}</main>`;
  bind();
}

async function irAFicha(id) {
  const lista = await listaEquipos();
  state.equipo = lista.find(e => e.ID === id) || { ID: id, Nombre: id };
  state.mantTipo = null; state.mantAcciones = new Set(); state.asigTipo = null;
  state.screen = 'ficha';
  render();
}

    <button class="btn-back" data-go="ficha">← Atras</button>
    <h1>Mantenimiento</h1>
    <p class="sub">${state.equipo?.Nombre || ''}</p>
    <div style="display:flex; gap:8px; margin-bottom:16px;">
      <button class="tipo ${state.mantTipo==='Preventivo'?'on':''}" id="t-prev">Preventivo</button>
      <button class="tipo ${state.mantTipo==='Correctivo'?'on':''}" id="t-corr">Correctivo</button>
    </div>
    ${state.mantTipo ? `
      <p class="sub" style="margin-bottom:8px;">Que se hizo (toca todo lo que aplique)</p>
      <div id="chips">${acciones.map(a => `<button class="chip ${state.mantAcciones.has(a)?'on':''}" data-chip="${a}">${a}</button>`).join('')}</div>
      <div id="err-mant" class="err" style="display:none;">Selecciona al menos una accion.</div>
      <button class="btn-primary" id="btn-guardar-mant">Registrar</button>
      <div id="ok-mant" class="ok" style="display:none;">Mantenimiento registrado</div>
    ` : ''}
  `;
}

function screenAsig() {
  const necesitaNombre = state.asigTipo === 'cambio' || state.asigTipo === 'prestamo';
  const esNuevo = state.asigTipo === 'nuevo';
  return `
    <button class="btn-back" data-go="ficha">← Atras</button>
    <h1>Movimiento de equipo</h1>
    <p class="sub">${state.equipo?.Nombre || ''}</p>
    ${ASIG_OPTS.map(o => `<button class="row-btn ${state.asigTipo === o.v ? 'sel' : ''}" data-asig="${o.v}" style="padding:14px; border-color:${state.asigTipo===o.v?'var(--accent)':'var(--line)'};"><strong>${o.label}</strong><span class="d">${o.d}</span></button>`).join('')}
    ${necesitaNombre ? `
      <input id="asig-nombre" type="text" placeholder="${state.asigTipo === 'cambio' ? 'Nombre del nuevo responsable' : 'A quien se le presta'}" style="margin-top:10px;">
    ` : ''}
    ${esNuevo ? `
      <input id="nuevo-categoria" type="text" placeholder="Categoria (ej. Amoladora 7\\")" style="margin-top:10px;">
      <input id="nuevo-numero" type="text" placeholder="Numero / codigo">
      <input id="nuevo-responsable" type="text" placeholder="Asignar a (opcional)">
    ` : ''}
    <div id="err-asig" class="err" style="display:none;">Completa los datos para continuar.</div>
    ${state.asigTipo ? `<button class="btn-primary" id="btn-guardar-asig" style="margin-top:10px;">Registrar</button>` : ''}
    <div id="ok-asig" class="ok" style="display:none;">Movimiento registrado</div>
  `;
}

function screenInventario() {
  return `
    <button class="btn-back" data-go="home">← Atras</button>
    <h1>Inventario</h1>
    <p class="sub">Elige como quieres verlo</p>
    <button class="action-row" data-go="inventario-equipos">Todos los equipos<span class="d">Lista completa por categoria</span></button>
    <button class="action-row" data-go="inventario-personas">Por persona<span class="d">Que tiene asignado cada uno</span></button>
  `;
}

function screenInventarioEquipos() {
  return `
    <button class="btn-back" data-go="inventario">← Atras</button>
    <h1>Todos los equipos</h1>
    <div id="inv-equipos"></div>
  `;
}

function screenInventarioPersonas() {
  return `
    <button class="btn-back" data-go="inventario">← Atras</button>
    <h1>Por persona</h1>
    <div id="inv-personas"></div>
  `;
}

function screenHistorial() {
  const items = state.historial;
  return `
    <button class="btn-back" data-go="home">← Atras</button>
    <h1>Historial</h1>
    <p class="sub">Todo lo registrado por el equipo de mantenimiento</p>
    ${items.length === 0 ? '<p class="sub">' + (SCRIPT_URL ? 'Sin registros todavia.' : 'Conecta el Sheet para ver el historial real.') + '</p>' : ''}
    ${items.map(h => `
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <strong>${h.equipo}</strong>
          <span class="badge ${h.tipo === 'Correctivo' ? 'corr' : 'prev'}">${h.tipo}</span>
        </div>
        <span class="d">${h.accion} — ${h.tecnico}</span>
      </div>
    `).join('')}
  `;
}

function bind() {
  const btnTema = document.getElementById('btn-tema');
  if (btnTema) btnTema.addEventListener('click', toggleTheme);

  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { state.screen = b.dataset.go; render(); }));

  const btnCont = document.getElementById('btn-continuar');
  if (btnCont) btnCont.addEventListener('click', () => {
    const v = document.getElementById('nombre').value.trim();
    if (!v) { document.getElementById('err-nombre').style.display = 'block'; return; }
    state.tecnico = v;
    localStorage.setItem('taller_tecnico', v);
    render();
  });

  const buscar = document.getElementById('buscar');
  const btnLimpiar = document.getElementById('btn-limpiar');
  if (buscar) buscar.addEventListener('input', async () => {
    const q = buscar.value.trim();
    const res = document.getElementById('resultados');
    if (btnLimpiar) btnLimpiar.style.display = q ? 'block' : 'none';
    if (!q) { res.innerHTML = ''; return; }
    const lista = await listaEquipos();
    const m = lista.filter(e => coincide(e, q));
    res.innerHTML = `<div class="resultados-box"><p class="titulo-caja">Resultados</p>${renderListaAgrupada(m, 'irficha')}</div>`;
    document.querySelectorAll('[data-irficha]').forEach(b => b.addEventListener('click', () => irAFicha(b.dataset.irficha)));
  });
  if (btnLimpiar) btnLimpiar.addEventListener('click', () => {
    buscar.value = '';
    document.getElementById('resultados').innerHTML = '';
    btnLimpiar.style.display = 'none';
    buscar.focus();
  });

  document.querySelectorAll('[data-cat-for]').forEach(b => b.addEventListener('click', async () => {
    state.selectNext = b.dataset.catFor;
    state.screen = 'categorias';
    render();
    const lista = await listaEquipos();
    const grupos = agruparPorCategoria(lista);
    const grid = document.getElementById('cat-grid');
    grid.innerHTML = Object.entries(grupos).map(([cat, items]) => `
      <button class="cat-card" data-cat="${cat}">
        <span class="icono-circulo">${iconoDe(cat)}</span>
        <strong>${cat}</strong>
        <span class="count">${items.length} equipo${items.length === 1 ? '' : 's'}</span>
      </button>
    `).join('');
    document.querySelectorAll('[data-cat]').forEach(c => c.addEventListener('click', () => {
      state.selCategoria = c.dataset.cat;
      state.screen = 'catlist';
      render();
      cargarCatList();
    }));
  }));

  async function cargarCatList() {
    const lista = await listaEquipos();
    const items = lista.filter(e => e.Categoria === state.selCategoria);
    const res = document.getElementById('catlist-resultados');
    res.innerHTML = items.map(e => `<button class="row-btn" data-seleccionar="${e.ID}"><strong>${e.Nombre}</strong><span class="d">${e['Asignado a'] || ''}${e.NumeroSerie ? ' — serie ' + e.NumeroSerie : ''}</span></button>`).join('');
    document.querySelectorAll('[data-seleccionar]').forEach(b => b.addEventListener('click', async () => {
      await irAFicha(b.dataset.seleccionar);
      state.screen = state.selectNext;
      render();
    }));
  }
  if (state.screen === 'catlist') cargarCatList();

  if (state.screen === 'inventario-equipos') {
    listaEquipos().then(lista => {
      const grupos = agruparPorCategoria(lista);
      document.getElementById('inv-equipos').innerHTML = Object.entries(grupos).map(([cat, items]) => `
        <p class="grupo-titulo">${cat} (${items.length})</p>
        ${items.map(e => `<div class="card" style="padding:12px 14px; margin-bottom:6px;"><strong style="font-size:13.5px;">${e.Nombre}</strong><span class="d">${e['Asignado a'] || 'Sin asignar'}${e.Estado ? ' — ' + e.Estado : ''}</span></div>`).join('')}
      `).join('');
    });
  }

  if (state.screen === 'inventario-personas') {
    listaEquipos().then(lista => {
      const porPersona = {};
      lista.forEach(e => {
        const persona = e['Asignado a'] || 'Sin asignar';
        (porPersona[persona] = porPersona[persona] || []).push(e);
      });
      document.getElementById('inv-personas').innerHTML = Object.entries(porPersona).map(([persona, items]) => `
        <p class="grupo-titulo">${persona} (${items.length})</p>
        ${items.map(e => `<div class="card" style="padding:12px 14px; margin-bottom:6px;"><strong style="font-size:13.5px;">${e.Nombre}</strong><span class="d">${e.Categoria}${e.NumeroSerie ? ' — serie ' + e.NumeroSerie : ''}</span></div>`).join('')}
      `).join('');
    });
  }

  ['t-prev','t-corr'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('click', () => {
      state.mantTipo = id === 't-prev' ? 'Preventivo' : 'Correctivo';
      state.mantAcciones = new Set();
      render();
    });
  });

  document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    const a = c.dataset.chip;
    if (state.mantAcciones.has(a)) state.mantAcciones.delete(a); else state.mantAcciones.add(a);
    render();
  }));

  const btnGuardarMant = document.getElementById('btn-guardar-mant');
  if (btnGuardarMant) btnGuardarMant.addEventListener('click', async () => {
    if (state.mantAcciones.size === 0) { document.getElementById('err-mant').style.display = 'block'; return; }
    await api('addMantenimiento', 'POST', {
      idEquipo: state.equipo.ID,
      tecnico: state.tecnico,
      tipo: state.mantTipo,
      acciones: Array.from(state.mantAcciones)
    });
    document.getElementById('ok-mant').style.display = 'block';
  });

  document.querySelectorAll('[data-asig]').forEach(b => b.addEventListener('click', () => {
    state.asigTipo = b.dataset.asig;
    render();
  }));

  const btnGuardarAsig = document.getElementById('btn-guardar-asig');
  if (btnGuardarAsig) btnGuardarAsig.addEventListener('click', async () => {
    if (state.asigTipo === 'nuevo') {
      const categoria = document.getElementById('nuevo-categoria')?.value.trim() || '';
      const numero = document.getElementById('nuevo-numero')?.value.trim() || '';
      const responsable = document.getElementById('nuevo-responsable')?.value.trim() || '';
      if (!categoria || !numero) { document.getElementById('err-asig').style.display = 'block'; return; }
      await api('addEquipo', 'POST', {
        id: `${categoria}-${numero}`.toUpperCase().replace(/\s+/g, ''),
        categoria, numero, responsable,
        tipoResponsable: responsable ? 'Persona' : '',
        estado: 'Activo'
      });
      document.getElementById('ok-asig').style.display = 'block';
      return;
    }
    const necesitaNombre = state.asigTipo === 'cambio' || state.asigTipo === 'prestamo';
    const nombre = document.getElementById('asig-nombre')?.value.trim() || '';
    if (necesitaNombre && !nombre) { document.getElementById('err-asig').style.display = 'block'; return; }
    await api('addAsignacion', 'POST', {
      idEquipo: state.equipo.ID,
      tipo: state.asigTipo,
      responsableNuevo: nombre
    });
    document.getElementById('ok-asig').style.display = 'block';
  });
}

initTheme();
render();
</script>
</body>
</html>
